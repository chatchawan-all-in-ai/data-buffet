# Cloud Workflows `datamart-publish` — publishes changed rows of each Pub/Sub export table.
# Started every 5 minutes by Cloud Scheduler `datamart-publish-every-5m`; deployed by setup.sh.
# Contract: document/project_wiki/cdc-process/process.md (Pub/Sub export pilot).
#
# For every row of process_dataset.mart_export_config:
#   1. read the config through tabledata.list (no query cost);
#   2. list Dataform workflow invocations of repository data-buffet that ended after
#      last_invocation_end (scheduler = workflowConfig, unset = manual);
#   3. none -> end; failed or did not run the table -> only advance last_invocation_*;
#      a SUCCEEDED invocation whose action `table_name` SUCCEEDED -> continue with the newest one;
#   4. claim the row (claimed_at empty or older than CLAIM_TIMEOUT_MINUTES), 0 rows -> end;
#   5. diff the export view with mart_sent_state -> NEW / UPDATE / DELETE;
#   6. publish one message per changed row (no attributes);
#   7. MERGE the sent rows into mart_sent_state (DELETE removes the row);
#   8. set last_invocation_* to that invocation and clear claimed_at;
#   9. on any failure post to Slack and leave last_invocation_* unchanged (the claim
#      expires after CLAIM_TIMEOUT_MINUTES, so the next attempt comes at most that late).
# A new export table needs only its view + a mart-export-config.json entry, no change here.

main:
  steps:
    - init:
        assign:
          - cfg:
              project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
              bq_location: us-central1
              dataset: process_dataset
              dataform_repo: ${"projects/" + sys.get_env("GOOGLE_CLOUD_PROJECT_ID") + "/locations/us-central1/repositories/data-buffet"}
              slack_secret: slack-datamart-dataform
              claim_timeout_minutes: 30
              # Window searched while last_invocation_end is still NULL (first export of a table).
              first_run_lookback_hours: 48
              # Diff rows per page: one page is published and recorded before the next is read,
              # which keeps a page under the 512 KB Workflows variable limit.
              page_rows: 50
          - failed: []
          - summary: []
    - read_config:
        try:
          call: googleapis.bigquery.v2.tabledata.list
          args:
            projectId: ${cfg.project}
            datasetId: ${cfg.dataset}
            tableId: mart_export_config
            maxResults: 1000
          result: config_data
        except:
          as: e
          steps:
            - notify_config:
                call: notify_slack
                args:
                  cfg: ${cfg}
                  table_name: mart_export_config
                  error: ${e}
            - stop:
                raise: ${e}
    - each_table:
        for:
          value: row
          in: ${default(map.get(config_data, "rows"), [])}
          steps:
            # Column order of mart_export_config: table_name, source_view, topic,
            # last_invocation_id, last_invocation_end (epoch seconds), claimed_at.
            - table_row:
                assign:
                  - export:
                      table_name: ${row.f[0].v}
                      source_view: ${row.f[1].v}
                      topic: ${row.f[2].v}
                      last_invocation_id: ${row.f[3].v}
                      last_invocation_end: ${row.f[4].v}
            - run_table:
                try:
                  steps:
                    - export_table:
                        call: export_table
                        args:
                          cfg: ${cfg}
                          export: ${export}
                        result: outcome
                    - record_outcome:
                        assign:
                          - summary: '${list.concat(summary, export.table_name + ": " + outcome)}'
                except:
                  as: e
                  steps:
                    - notify:
                        call: notify_slack
                        args:
                          cfg: ${cfg}
                          table_name: ${export.table_name}
                          error: ${e}
                    - record_failure:
                        assign:
                          - failed: ${list.concat(failed, export.table_name)}
    - fail_if_any:
        switch:
          - condition: ${len(failed) > 0}
            raise:
              message: ${"datamart-publish failed for " + json.encode_to_string(failed)}
              summary: ${summary}
    - done:
        return: ${summary}

# Steps 2-8 for one export table. Returns a one-line outcome; raises on any failure.
export_table:
  params: [cfg, export]
  steps:
    - checkpoint:
        assign:
          - last_id: ${export.last_invocation_id}
          # Epoch seconds; -1 = no checkpoint yet. Every end time compared below is a number,
          # never null, so no condition depends on how Workflows evaluates and/or.
          - last_end: -1
          - list_after: ${sys.now() - cfg.first_run_lookback_hours * 3600}
    - checkpoint_known:
        switch:
          - condition: ${export.last_invocation_end != null}
            assign:
              - last_end: ${double(export.last_invocation_end)}
              # One second back: tabledata.list returns seconds as a float; the exact cut is below.
              - list_after: ${last_end - 1}
    - init_scan:
        assign:
          - newest: null
          - newest_end: -1
          - best: null
          - best_end: -1
          - query:
              pageSize: 1000
              filter: ${"invocation_timing.end_time > \"" + time.format(int(list_after)) + "\""}
              fields: workflowInvocations(name,state,workflowConfig,invocationTiming/endTime),nextPageToken
    - list_invocations:
        call: http.get
        args:
          url: ${"https://dataform.googleapis.com/v1beta1/" + cfg.dataform_repo + "/workflowInvocations"}
          auth:
            type: OAuth2
          query: ${query}
        result: listed
    - scan_page:
        for:
          value: inv
          in: ${default(map.get(listed.body, "workflowInvocations"), [])}
          steps:
            - describe:
                assign:
                  - inv_id: ${text.split(inv.name, "/")[len(text.split(inv.name, "/")) - 1]}
                  # A list of keys reads the nested field; null when invocationTiming is missing.
                  - inv_end_text: ${map.get(inv, ["invocationTiming", "endTime"])}
                  - scheduler: manual
            - skip_running:
                switch:
                  - condition: ${inv_end_text == null}
                    next: continue
            - parse_end:
                assign:
                  - inv_end: ${time.parse(inv_end_text)}
            - skip_handled:
                switch:
                  - condition: ${inv_id == last_id or inv_end <= last_end}
                    next: continue
            - scheduler_name:
                switch:
                  - condition: ${map.get(inv, "workflowConfig") != null}
                    assign:
                      - scheduler: ${text.split(inv.workflowConfig, "/")[len(text.split(inv.workflowConfig, "/")) - 1]}
            - describe_candidate:
                assign:
                  - candidate:
                      id: ${inv_id}
                      name: ${inv.name}
                      end: ${inv_end}
                      end_text: ${inv_end_text}
                      scheduler: ${scheduler}
            - track_newest:
                switch:
                  - condition: ${inv_end > newest_end}
                    assign:
                      - newest: ${candidate}
                      - newest_end: ${inv_end}
            - only_succeeded:
                switch:
                  - condition: ${inv.state != "SUCCEEDED" or inv_end <= best_end}
                    next: continue
            - check_actions:
                call: ran_table
                args:
                  invocation_name: ${inv.name}
                  table_name: ${export.table_name}
                result: ran
            - track_best:
                switch:
                  - condition: ${ran}
                    assign:
                      - best: ${candidate}
                      - best_end: ${inv_end}
    - next_invocation_page:
        switch:
          - condition: ${map.get(listed.body, "nextPageToken") != null}
            assign:
              - query.pageToken: ${listed.body.nextPageToken}
            next: list_invocations
    - nothing_new:
        switch:
          - condition: ${newest == null}
            return: no new invocation
    - advance_only:
        switch:
          - condition: ${best == null}
            steps:
              - advance:
                  call: bq_run
                  args:
                    cfg: ${cfg}
                    sql: |
                      UPDATE `{{dataset}}.mart_export_config`
                      SET
                        last_invocation_id = @invocation_id,
                        last_invocation_end = TIMESTAMP(REGEXP_REPLACE(@invocation_end, r'(\.\d{6})\d+', r'\1')),
                        claimed_at = NULL
                      WHERE table_name = @table_name
                        AND (claimed_at IS NULL
                          OR claimed_at < TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL @claim_timeout_minutes MINUTE))
                        AND (last_invocation_end IS NULL
                          OR last_invocation_end < TIMESTAMP(REGEXP_REPLACE(@invocation_end, r'(\.\d{6})\d+', r'\1')))
                    params:
                      - [table_name, STRING, "${export.table_name}"]
                      - [invocation_id, STRING, "${newest.id}"]
                      - [invocation_end, STRING, "${newest.end_text}"]
                      - [claim_timeout_minutes, INT64, "${string(cfg.claim_timeout_minutes)}"]
                  result: advanced
              - log_advance:
                  call: sys.log
                  args:
                    severity: INFO
                    text: ${export.table_name + " advanced to " + newest.id + " (" + newest.scheduler + "), nothing to export, rows updated " + advanced.dml_rows}
              - return_advanced:
                  return: ${"advanced to " + newest.id}
    - claim_token:
        # Written by the claim; the release must find it unchanged, or the claim was lost.
        assign:
          - claim_value: ${time.format(sys.now())}
    - claim:
        call: bq_run
        args:
          cfg: ${cfg}
          sql: |
            UPDATE `{{dataset}}.mart_export_config`
            SET claimed_at = TIMESTAMP(REGEXP_REPLACE(@claim, r'(\.\d{6})\d+', r'\1'))
            WHERE table_name = @table_name
              AND (claimed_at IS NULL
                OR claimed_at < TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL @claim_timeout_minutes MINUTE))
              AND (last_invocation_end IS NULL
                OR last_invocation_end < TIMESTAMP(REGEXP_REPLACE(@invocation_end, r'(\.\d{6})\d+', r'\1')))
          params:
            - [table_name, STRING, "${export.table_name}"]
            - [claim, STRING, "${claim_value}"]
            - [invocation_end, STRING, "${best.end_text}"]
            - [claim_timeout_minutes, INT64, "${string(cfg.claim_timeout_minutes)}"]
        result: claimed
    - claimed_check:
        switch:
          - condition: ${int(claimed.dml_rows) == 0}
            return: ${"claimed elsewhere or already handled; skipped " + best.id}
    - log_claim:
        call: sys.log
        args:
          severity: INFO
          text: ${export.table_name + " exporting for invocation " + best.id + " (" + best.scheduler + ")"}
    - diff:
        call: bq_run
        args:
          cfg: ${cfg}
          # The message is assembled as text so primary_key is row_key verbatim and data is
          # TO_JSON_STRING of the data columns in view order, the same JSON row_hash fingerprints.
          sql: |
            WITH v AS (
              SELECT
                e.row_key,
                e.row_hash,
                TO_JSON_STRING((SELECT AS STRUCT e.* EXCEPT (row_key, row_hash))) AS data
              FROM `{{source_view}}` AS e
            ),
            s AS (
              SELECT row_key, row_hash
              FROM `{{dataset}}.mart_sent_state`
              WHERE table_name = @table_name
            )
            SELECT
              COALESCE(v.row_key, s.row_key) AS row_key,
              v.row_hash,
              CONCAT(
                '{"table":', TO_JSON_STRING(@table_name),
                ',"run_date":', TO_JSON_STRING(FORMAT_DATE('%F', CURRENT_DATE('Asia/Bangkok'))),
                ',"operation":', TO_JSON_STRING(CASE
                  WHEN s.row_key IS NULL THEN 'NEW'
                  WHEN v.row_key IS NULL THEN 'DELETE'
                  ELSE 'UPDATE'
                END),
                ',"primary_key":', COALESCE(v.row_key, s.row_key),
                ',"data":', IFNULL(v.data, 'null'),
                '}'
              ) AS message
            FROM v
            FULL OUTER JOIN s ON v.row_key = s.row_key
            WHERE s.row_key IS NULL OR v.row_key IS NULL OR v.row_hash != s.row_hash
            ORDER BY row_key
          source_view: ${export.source_view}
          params:
            - [table_name, STRING, "${export.table_name}"]
        result: page
    - init_publish:
        assign:
          - sent_total: 0
    - publish_page:
        call: publish_and_record
        args:
          cfg: ${cfg}
          export: ${export}
          invocation_id: ${best.id}
          rows: ${page.rows}
        result: sent_count
    - count_page:
        assign:
          - sent_total: ${sent_total + sent_count}
    - last_diff_page:
        switch:
          - condition: ${page.page_token == null}
            next: release
    - read_next_page:
        call: googleapis.bigquery.v2.jobs.getQueryResults
        args:
          projectId: ${cfg.project}
          jobId: ${page.job_id}
          location: ${cfg.bq_location}
          maxResults: ${cfg.page_rows}
          pageToken: ${page.page_token}
          timeoutMs: 60000
        result: next_result
    - unpack_next_page:
        assign:
          - page.rows: ${default(map.get(next_result, "rows"), [])}
          - page.page_token: ${map.get(next_result, "pageToken")}
        next: publish_page
    - release:
        call: bq_run
        args:
          cfg: ${cfg}
          sql: |
            UPDATE `{{dataset}}.mart_export_config`
            SET
              last_invocation_id = @invocation_id,
              last_invocation_end = TIMESTAMP(REGEXP_REPLACE(@invocation_end, r'(\.\d{6})\d+', r'\1')),
              claimed_at = NULL
            WHERE table_name = @table_name
              AND claimed_at = TIMESTAMP(REGEXP_REPLACE(@claim, r'(\.\d{6})\d+', r'\1'))
          params:
            - [table_name, STRING, "${export.table_name}"]
            - [invocation_id, STRING, "${best.id}"]
            - [invocation_end, STRING, "${best.end_text}"]
            - [claim, STRING, "${claim_value}"]
        result: released
    - released_check:
        switch:
          - condition: ${int(released.dml_rows) == 0}
            raise: ${"claim on " + export.table_name + " was lost before release (older than " + string(cfg.claim_timeout_minutes) + " minutes?); last_invocation_* not moved"}
    - log_done:
        call: sys.log
        args:
          severity: INFO
          text: ${export.table_name + " sent " + string(sent_total) + " rows for invocation " + best.id + " (" + best.scheduler + ")"}
    - return_sent:
        return: ${"sent " + string(sent_total) + " rows for " + best.id}

# True when the invocation ran action `table_name` and that action SUCCEEDED.
ran_table:
  params: [invocation_name, table_name]
  steps:
    - init:
        assign:
          - query:
              pageSize: 1000
              fields: workflowInvocationActions(target/name,state),nextPageToken
    - read_actions:
        call: http.get
        args:
          url: ${"https://dataform.googleapis.com/v1beta1/" + invocation_name + ":query"}
          auth:
            type: OAuth2
          query: ${query}
        result: actions
    - find:
        for:
          value: action
          in: ${default(map.get(actions.body, "workflowInvocationActions"), [])}
          steps:
            - match:
                switch:
                  - condition: ${action.target.name == table_name and action.state == "SUCCEEDED"}
                    return: true
    - next_page:
        switch:
          - condition: ${map.get(actions.body, "nextPageToken") != null}
            assign:
              - query.pageToken: ${actions.body.nextPageToken}
            next: read_actions
    - not_found:
        return: false

# Publishes one diff page (row_key, row_hash, message) and MERGEs it into mart_sent_state.
publish_and_record:
  params: [cfg, export, invocation_id, rows]
  steps:
    - empty:
        switch:
          - condition: ${len(rows) == 0}
            return: 0
    - init:
        assign:
          - messages: []
          - sent: []
    - build:
        for:
          value: r
          in: ${rows}
          steps:
            - add:
                assign:
                  # Map literals are not allowed inside ${}, so each entry is built first.
                  - message:
                      data: ${base64.encode(text.encode(r.f[2].v))}
                  # h = null marks a DELETE: the MERGE removes the key.
                  - sent_row:
                      k: ${r.f[0].v}
                      h: ${r.f[1].v}
                  - messages: ${list.concat(messages, message)}
                  - sent: ${list.concat(sent, sent_row)}
    - publish:
        call: googleapis.pubsub.v1.projects.topics.publish
        args:
          topic: ${"projects/" + cfg.project + "/topics/" + export.topic}
          body:
            messages: ${messages}
    - record:
        call: bq_run
        args:
          cfg: ${cfg}
          sql: |
            MERGE `{{dataset}}.mart_sent_state` AS t
            USING (
              SELECT
                JSON_VALUE(r, '$.k') AS row_key,
                CAST(JSON_VALUE(r, '$.h') AS INT64) AS row_hash
              FROM UNNEST(JSON_QUERY_ARRAY(@sent)) AS r
            ) AS s
            ON t.table_name = @table_name AND t.row_key = s.row_key
            WHEN MATCHED AND s.row_hash IS NULL THEN
              DELETE
            WHEN MATCHED THEN
              UPDATE SET row_hash = s.row_hash, invocation_id = @invocation_id, sent_at = CURRENT_TIMESTAMP()
            WHEN NOT MATCHED AND s.row_hash IS NOT NULL THEN
              INSERT (table_name, row_key, row_hash, invocation_id, sent_at)
              VALUES (@table_name, s.row_key, s.row_hash, @invocation_id, CURRENT_TIMESTAMP())
          params:
            - [table_name, STRING, "${export.table_name}"]
            - [invocation_id, STRING, "${invocation_id}"]
            - [sent, STRING, "${json.encode_to_string(sent)}"]
    - count:
        return: ${len(rows)}

# Runs one standard-SQL statement with named parameters and waits for it.
# `sql` may use {{dataset}} (project.process dataset) and {{source_view}}; params = [[name, type, value], ...].
# Returns rows (first page, at most cfg.page_rows), page_token, job_id and dml_rows.
bq_run:
  params: [cfg, sql, params, source_view: ""]
  steps:
    - build:
        assign:
          - query_parameters: []
          - statement: ${text.replace_all(text.replace_all(sql, "{{dataset}}", cfg.project + "." + cfg.dataset), "{{source_view}}", source_view)}
    - each_param:
        for:
          value: p
          in: ${params}
          steps:
            - add:
                assign:
                  - query_parameter:
                      name: ${p[0]}
                      parameterType:
                        type: ${p[1]}
                      parameterValue:
                        value: ${p[2]}
                  - query_parameters: ${list.concat(query_parameters, query_parameter)}
    - run:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${cfg.project}
          body:
            query: ${statement}
            useLegacySql: false
            location: ${cfg.bq_location}
            parameterMode: NAMED
            queryParameters: ${query_parameters}
            maxResults: ${cfg.page_rows}
            timeoutMs: 60000
        result: result
    - wait:
        switch:
          - condition: ${result.jobComplete}
            next: out
    - poll:
        call: googleapis.bigquery.v2.jobs.getQueryResults
        args:
          projectId: ${cfg.project}
          jobId: ${result.jobReference.jobId}
          location: ${cfg.bq_location}
          maxResults: ${cfg.page_rows}
          timeoutMs: 60000
        result: result
        next: wait
    - out:
        return:
          rows: ${default(map.get(result, "rows"), [])}
          page_token: ${map.get(result, "pageToken")}
          job_id: ${result.jobReference.jobId}
          dml_rows: ${default(map.get(result, "numDmlAffectedRows"), "0")}

# Posts the failure to Slack; the webhook URL is read from Secret Manager and never logged.
notify_slack:
  params: [cfg, table_name, error]
  steps:
    - log_error:
        call: sys.log
        args:
          severity: ERROR
          json:
            table_name: ${table_name}
            error: ${error}
    - post:
        try:
          steps:
            - webhook:
                call: googleapis.secretmanager.v1.projects.secrets.versions.accessString
                args:
                  secret_id: ${cfg.slack_secret}
                  project_id: ${cfg.project}
                result: webhook_url
            - send:
                call: http.post
                args:
                  url: ${webhook_url}
                  body:
                    text: '${":red_circle: datamart-publish failed for `" + table_name + "` (execution " + sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID") + "); last_invocation_* unchanged, retried after the claim expires. Error " + json.encode_to_string(error)}'
        except:
          as: slack_error
          steps:
            - log_slack_failure:
                call: sys.log
                args:
                  severity: ERROR
                  text: ${"Slack notification failed with code " + string(default(map.get(slack_error, "code"), "unknown"))}
